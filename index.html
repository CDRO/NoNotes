<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="NoNotes – lokale Notizen als Mindmap, gespeichert in einer SQLite-Datei. Läuft ohne Server direkt im Browser.">
  <title>NoNotes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-ready="false" class="view-map">

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">N</span>
        <span>NoNotes</span>
        <span class="version" id="version"></span>
      </div>

      <div class="segmented" role="tablist" aria-label="Ansicht">
        <button type="button" id="viewMapBtn" role="tab" data-view="map" aria-selected="true">Mindmap</button>
        <button type="button" id="viewListBtn" role="tab" data-view="list" aria-selected="false">Liste</button>
        <button type="button" id="viewQuestionsBtn" role="tab" data-view="questions" aria-selected="false">Fragen</button>
      </div>

      <div class="status" id="status" aria-live="polite" data-state=""></div>
      <div class="storage" id="storageInfo" title="">
        <span class="dot" aria-hidden="true"></span>
        <span class="label"></span>
      </div>
      <div class="menu">
        <button type="button" id="menuBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">Datenbank ▾</button>
        <div id="menu" class="menu-panel" role="menu" hidden>
          <button type="button" id="createFileBtn" role="menuitem">Datenbankdatei anlegen…</button>
          <button type="button" id="openFileBtn" role="menuitem">Datenbankdatei öffnen…</button>
          <button type="button" id="disconnectBtn" role="menuitem">Dateiverbindung trennen</button>
          <div class="sep" role="separator"></div>
          <button type="button" id="downloadBtn" role="menuitem">Kopie herunterladen (.sqlite)</button>
          <button type="button" id="importBtn" role="menuitem">Aus Datei importieren…</button>
          <div class="sep" role="separator"></div>
          <div class="hint" id="menuHint"></div>
        </div>
      </div>
    </header>

    <div id="banner" class="banner" role="status" hidden></div>

    <main class="layout">
      <!-- Mindmap -->
      <section class="map-view" id="mapView" aria-label="Mindmap">
        <div class="map-toolbar">
          <button type="button" id="mapNewBtn" class="primary" title="Neue Notiz unter der Auswahl (Tab)">Neue Notiz</button>
          <button type="button" id="mapFitBtn" title="Alles einpassen (0)">Einpassen</button>
          <button type="button" id="mapZoomOutBtn" title="Verkleinern (−)" aria-label="Verkleinern">−</button>
          <button type="button" id="mapZoomInBtn" title="Vergrössern (+)" aria-label="Vergrössern">+</button>
          <input type="search" id="mapSearch" class="map-search" placeholder="Suchen…" aria-label="Notizen durchsuchen" autocomplete="off">
          <span class="map-matches" id="mapMatches" hidden></span>
          <span class="map-hint">Doppelklick öffnet · Rechtsklick für Aktionen · Ziehen hängt um</span>
        </div>
        <svg id="mindmap" class="mindmap" tabindex="0" role="application" aria-label="Mindmap der Notizen"></svg>
        <input type="text" id="renameInput" class="rename-input" aria-label="Titel bearbeiten" hidden>
      </section>

      <!-- Fragen -->
      <section class="questions-view" id="questionsView" aria-label="Fragen">
        <div class="q-toolbar">
          <div class="segmented" id="qFilter" role="tablist" aria-label="Filter">
            <button type="button" role="tab" data-status="open" aria-selected="true">Offen</button>
            <button type="button" role="tab" data-status="all" aria-selected="false">Alle</button>
            <button type="button" role="tab" data-status="answered" aria-selected="false">Beantwortet</button>
          </div>
          <input type="search" id="qSearch" placeholder="Fragen durchsuchen…" aria-label="Fragen durchsuchen" autocomplete="off">
          <select id="qTagFilter" aria-label="Nach Tag filtern"><option value="">Alle Tags</option></select>
          <span class="q-count" id="qCount"></span>
        </div>
        <div class="q-list" id="qList"></div>
        <div class="empty" id="qEmpty" hidden></div>
      </section>

      <!-- Liste -->
      <aside class="sidebar" id="sidebar" aria-label="Notizliste">
        <div class="sidebar-tools">
          <input type="search" id="search" placeholder="Suchen…" aria-label="Notizen durchsuchen" autocomplete="off">
          <button type="button" id="newBtn" class="primary" title="Neue Notiz (Alt+N)">Neue Notiz</button>
        </div>
        <div class="sidebar-filters">
          <select id="listScope" aria-label="Bereich">
            <option value="live">Notizen</option>
            <option value="trash">Papierkorb</option>
          </select>
          <select id="tagFilter" aria-label="Nach Tag filtern"><option value="">Alle Tags</option></select>
        </div>
        <ul id="list" class="note-list" role="listbox" aria-label="Notizen"></ul>
        <div id="listEmpty" class="empty" hidden></div>
        <div class="sidebar-foot">
          <span id="count"></span>
          <button type="button" id="emptyTrashBtn" class="ghost danger small" hidden>Papierkorb leeren</button>
        </div>
      </aside>

      <!-- Editor (Seitenbereich in der Liste, Vollbild aus der Mindmap) -->
      <section class="editor" id="editor" aria-label="Editor">
        <div id="editorEmpty" class="empty editor-empty">
          Wähle links eine Notiz oder lege eine neue an.
        </div>
        <div id="editorPane" hidden>
          <div class="editor-bar">
            <button type="button" id="backBtn" class="ghost back-btn" title="Zurück (Esc)">← Zurück</button>
            <nav class="crumbs" id="crumbs" aria-label="Pfad"></nav>
            <span class="meta" id="noteMeta"></span>
            <button type="button" id="childBtn" class="ghost" title="Unternotiz anlegen">+ Unternotiz</button>
            <button type="button" id="deleteBtn" class="ghost danger">Löschen</button>
          </div>
          <div id="trashBar" class="trash-bar" hidden>
            <span>Diese Notiz liegt im Papierkorb.</span>
            <button type="button" id="restoreBtn" class="primary">Wiederherstellen</button>
            <button type="button" id="purgeBtn" class="danger">Endgültig löschen</button>
          </div>
          <input type="text" id="title" class="title" placeholder="Titel" aria-label="Titel" autocomplete="off" spellcheck="true">
          <div class="tags-row">
            <div id="tagChips" class="chips" aria-label="Tags"></div>
            <input type="text" id="tagInput" class="tag-input" list="tagSuggestions" placeholder="Tag hinzufügen…" aria-label="Tag hinzufügen" autocomplete="off">
            <datalist id="tagSuggestions"></datalist>
          </div>
          <div class="editor-tools">
            <button type="button" id="questionBtn" class="ghost" title="Zeile als Frage markieren (Ctrl+Shift+F)">? Frage</button>
            <button type="button" id="answerBtn" class="ghost" title="Zeile als Antwort markieren (Ctrl+Shift+A)">! Antwort</button>
            <span class="tools-hint" id="noteQuestions"></span>
            <div class="segmented small" id="modeSwitch" role="tablist" aria-label="Darstellung">
              <button type="button" role="tab" data-mode="edit" aria-selected="true" title="Bearbeiten (Ctrl+E)">Bearbeiten</button>
              <button type="button" role="tab" data-mode="split" aria-selected="false" title="Geteilt (Ctrl+E)">Geteilt</button>
              <button type="button" role="tab" data-mode="preview" aria-selected="false" title="Vorschau (Ctrl+E)">Vorschau</button>
            </div>
          </div>
          <div class="editor-body" id="editorBody">
            <textarea id="body" class="body" placeholder="Notiz… (Markdown; Zeile mit ? = Frage, darunter Zeilen mit ! = Antwort; [[Titel]] verweist auf eine Notiz)" aria-label="Inhalt" spellcheck="true"></textarea>
            <div id="preview" class="preview md" aria-label="Vorschau" tabindex="0"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="contextMenu" class="context-menu" role="menu" hidden></div>

  <div id="boot" class="boot">Lade NoNotes…</div>

  <input type="file" id="importInput" accept=".sqlite,.sqlite3,.db,application/vnd.sqlite3,application/x-sqlite3" hidden>

  <script src="js/version.js"></script>
  <script src="vendor/sql.js/sql-asm.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/db.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/mindmap.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
