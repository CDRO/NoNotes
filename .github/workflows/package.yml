name: Testen und paketieren

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Version, z. B. v0.1.0. Legt Tag und Release auf dem gewählten Stand an. Leer = nur Artefakt bauen.'
        required: false
        default: ''

permissions:
  contents: write
  actions: write   # doppelte Läufe abbrechen (erster Schritt)

jobs:
  build:
    name: Smoke-Test und ZIP
    runs-on: ubuntu-latest
    steps:
      # Ressourcen sparen: Ein Push auf einen anderen Zweig als main bricht ab, wenn dieser Workflow mit demselben Commit auf
      # main schon läuft, wartet oder dort grün war; main prüft denselben Stand. Darum zuerst main pushen, dann den Zweig.
      - name: Abbrechen, wenn derselbe Commit schon auf main läuft
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WF="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.workflow_id')"
          ON_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?branch=main&head_sha=${GITHUB_SHA}&per_page=50" \
            --jq '[.workflow_runs[] | select(.status != "completed" or .conclusion == "success")] | length')"
          if [[ "${ON_MAIN}" -eq 0 ]]; then
            echo "Commit ${GITHUB_SHA::7} läuft nicht auf main: weiter."
            exit 0
          fi
          echo "Commit ${GITHUB_SHA::7} läuft schon auf main (oder war dort grün): dieser Lauf auf ${GITHUB_REF_NAME} bricht ab."
          gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"
          for _ in $(seq 1 60); do sleep 5; done   # der Abbruch beendet den Lauf hier
          echo "Abbruch hat nicht gegriffen." >&2
          exit 1

      - name: Code holen
        uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Version bestimmen
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          RELEASE="false"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            RELEASE="true"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            if [[ ! "${INPUT_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Ungültige Version '${INPUT_VERSION}', erwartet z. B. v0.1.0" >&2
              exit 1
            fi
            VERSION="${INPUT_VERSION}"
            RELEASE="true"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION} (Release: ${RELEASE})"

      # Ab v2.12.0 braucht jedes Release docs/releases/<Version>/RELEASE.md mit Screenshots und Update-Pfad
      # (docs/releases/README.md). Fehlt etwas, bricht der Lauf hier ab, vor den Tests.
      - name: Release-Notizen prüfen (ab v2.12.0)
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if node tools/release-notes.cjs required "$VERSION"; then
            node tools/release-notes.cjs check "$VERSION"
          else
            echo "$VERSION ist älter als v2.12.0: Beschreibung aus den Commits (--generate-notes)."
          fi

      - name: Abhängigkeiten installieren (nur für den Test)
        run: npm ci

      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium

      - name: Bauen und Smoke-Test (das Gebaute per file:// in Chromium)
        run: npm test

      - name: ZIP bauen (lokale Ausprägung, mit der Versionsnummer in der App)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node tools/build.cjs --edition local --version "$VERSION"
          (cd dist/NoNotes && zip -r -X "../NoNotes-$VERSION.zip" .)
          unzip -l "dist/NoNotes-$VERSION.zip"

      - name: ZIP als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: NoNotes-${{ steps.version.outputs.version }}
          path: dist/NoNotes-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      # Zweites Artefakt «NoNotes (with Plugins)»: dieselbe App samt allen Erweiterungen aus CDRO/NoNotes-plugins.
      # Ist dieses Repository privat, braucht es hier ein Secret PLUGINS_TOKEN (Fine-grained Token, Leserecht auf
      # dessen Inhalt); ohne Zugriff gibt es eine Warnung und nur das ZIP ohne Erweiterungen.
      - name: Erweiterungen holen (CDRO/NoNotes-plugins)
        id: plugins
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: CDRO/NoNotes-plugins
          ref: plugins
          token: ${{ secrets.PLUGINS_TOKEN || github.token }}
          path: build/erweiterungen
          persist-credentials: false

      - name: Hinweis, wenn die Erweiterungen fehlen
        if: steps.plugins.outcome != 'success'
        run: echo "::warning::CDRO/NoNotes-plugins konnte nicht geholt werden (privat? dann Secret PLUGINS_TOKEN mit Leserecht anlegen). Es gibt nur das ZIP ohne Erweiterungen."

      - name: ZIP mit Erweiterungen bauen (NoNotes-with-Plugins)
        if: steps.plugins.outcome == 'success'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node tools/build.cjs --edition local --version "$VERSION" --plugins build/erweiterungen --out dist/NoNotes-with-Plugins
          node -e '
            const fs = require("node:fs");
            const list = fs.readFileSync("dist/NoNotes-with-Plugins/plugins/plugins.js", "utf8");
            const cat = JSON.parse(/NoNotesPlugins\.catalog\((\[[\s\S]*?\])\);/.exec(list)[1]);
            console.log("Erweiterungen im Verzeichnis:");
            for (const e of cat) console.log(`  ${e.file}  ${e.id ? `${e.name} ${e.version || ""} (api ${e.api})` : "(ohne Angaben; meldet sich erst im Browser)"}`);
            const extern = cat.filter(e => !e.file.startsWith("beispiele/"));
            if (!extern.length) { console.error("Keine Erweiterung aus CDRO/NoNotes-plugins im Verzeichnis"); process.exit(1); }
          '
          (cd dist/NoNotes-with-Plugins && zip -r -X "../NoNotes-with-Plugins-$VERSION.zip" .)
          unzip -l "dist/NoNotes-with-Plugins-$VERSION.zip" | grep -E "plugins/|files$"

      - name: ZIP mit Erweiterungen als Artefakt bereitstellen
        if: steps.plugins.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NoNotes-with-Plugins-${{ steps.version.outputs.version }}
          path: dist/NoNotes-with-Plugins-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Release anlegen (Tag oder manueller Start mit Version; beide ZIPs, falls gebaut)
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -la dist/NoNotes-*.zip
          # Beschreibung: ab v2.12.0 aus docs/releases/<Version>/RELEASE.md (Bilder als Adressen im Tag, Vergleich mit dem
          # vorigen Release), davor aus den Commits.
          TITLE="NoNotes $VERSION"
          NOTES=(--generate-notes)
          if node tools/release-notes.cjs required "$VERSION"; then
            KNOWN="$(gh release list --limit 200 --json tagName -q '.[].tagName' 2>/dev/null | tr '\n' ' ' || true)"
            node tools/release-notes.cjs render "$VERSION" --repo "$GITHUB_REPOSITORY" --ref "$VERSION" --known "$KNOWN" \
              --out dist/release-notes.md --title-out dist/release-title.txt
            TITLE="$(cat dist/release-title.txt)"
            NOTES=(--notes-file dist/release-notes.md)
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION existiert bereits, ZIPs werden ersetzt."
            gh release upload "$VERSION" dist/NoNotes-*.zip --clobber
            if [[ -f dist/release-notes.md ]]; then
              gh release edit "$VERSION" --title "$TITLE" --notes-file dist/release-notes.md
            fi
          else
            # --target legt den Tag auf diesem Commit an, falls er noch nicht existiert.
            gh release create "$VERSION" dist/NoNotes-*.zip \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              "${NOTES[@]}"
          fi
